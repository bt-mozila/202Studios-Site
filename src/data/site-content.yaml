  faq:
    title: Frequently Asked Questions
    items:
      - question: What types of electronics and mobile repair services do you offer?
        answer: At 202Studios, we handle both mobile device repair and complex hardware diagnostics. Our mobile services include screen replacements, battery swaps, charging port repairs, and liquid damage recovery. Beyond smartphones and tablets, we perform board-level diagnostics and precision micro-soldering for computer components, laptops, and custom electronic control hardware.
      - question: How long does a typical mobile screen or battery repair take?
        answer: Most standard mobile repairs—such as screen replacements or battery installations—are completed within 30 minutes to 2 hours depending on parts availability. Complex repairs that involve logic board micro-soldering, data recovery, or liquid damage treatments generally take 24–48 hours for thorough testing and quality check.
      - question: Do you provide software and custom web development services?
        answer: Yes. In addition to hardware repairs, 202Studios builds custom software solutions, responsive websites, and specialized web applications. Whether you need a brand-new business website, an internal portal, or modifications to existing platforms, we deliver clean, performant code tailored to your goals.
      - question: How can 202Studios help streamline or automate my business operations?
        answer: We offer tailored business automation solutions designed to save time and reduce manual tasks. This includes setting up automated messaging systems, integrating digital workflows, configuring cloud routing/forms, and developing custom software scripts to connect your day-to-day tools into a single, cohesive workflow.
      - question: How do I get a quote, and do you offer warranties on hardware repairs?
        answer: You can request a free quote by reaching out through our contact page, sending us a message with your device/project details, or bringing your device in for a diagnostic check. All mobile and hardware repairs come with a standard service warranty covering installed parts and workmanship, ensuring your equipment performs reliably after service.
